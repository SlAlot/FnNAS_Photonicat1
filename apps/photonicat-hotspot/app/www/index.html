<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>光影猫热点</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./login.css"></head><body><main id="wlmb-panel" class="np-root auth-theme"><div id="auth-loading" class="np-auth-loading" role="status">正在连接…</div><div id="auth-view" class="np-auth-shell" hidden><div class="np-auth-stack"><section id="login" class="np-auth-card"><div class="np-auth-brand"><img class="np-auth-logo" src="./logo.png" alt="" width="46" height="46"><button type="button" class="np-auth-theme" data-auth-theme aria-label="切换外观">◐</button></div><h1>光影猫热点</h1><p class="np-auth-description">使用飞牛管理员账号登录</p><form id="login-form" class="np-auth-form"><label class="np-auth-field" for="username">管理员账号<input class="np-auth-input" id="username" name="username" autocomplete="username" placeholder="请输入管理员账号" required></label><label class="np-auth-field" for="password">密码<input class="np-auth-input" id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入管理员密码" required></label><div class="np-auth-options"><label class="np-auth-check"><input id="remember" type="checkbox">记住密码</label><label class="np-auth-check"><input id="auto-login" type="checkbox">自动登录</label></div><button type="submit" class="np-auth-submit">登录</button><p id="login-notice" class="np-auth-notice" role="status" aria-live="polite"></p></form></section><footer class="np-auth-footer">SlAlot</footer></div></div><div id="app-content" class="ap-shell" hidden><header class="app-header"><div><h1>光影猫热点</h1><p>无线网络与网络共享</p></div><div class="app-tools"><button type="button" data-auth-theme aria-label="切换外观">◐</button><button type="button" data-logout>退出登录</button></div></header><div id="notice" role="status">正在读取无线网卡…</div><section id="devices"></section><p class="hint">热点跟随当前可用的 5G 或 WAN 出口上网。关闭网页不影响热点；在应用中心停用插件会关闭热点并恢复无线网卡管理。</p><footer>SlAlot</footer></div></main><script src="./login.js"></script><script src="./app.js"></script></body></html>
