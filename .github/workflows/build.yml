name: Build Photonicat FnNAS

on:
  push:
    branches: [main]
    paths: ['files/**', 'scripts/**', 'tests/**', 'vendor/**', 'sources.lock.json', '.github/workflows/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_test_release:
        description: '构建通过后发布测试版；未经真机验收不标为正式版'
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: fnnas-photonicat-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install validation tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y device-tree-compiler gcc shellcheck
      - name: Validate source and board adaptation
        run: |
          python3 scripts/fetch-inputs.py sources work/source
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q scripts tests
          bash -n scripts/build-module.sh
          sh -n scripts/collect-network.sh
          sh -n files/etc/initramfs-tools/hooks/photonicat-net-names
          shellcheck scripts/build-module.sh scripts/collect-network.sh files/etc/initramfs-tools/hooks/photonicat-net-names
          git diff --check
  module:
    needs: validate
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Install native build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y gcc-12 g++-12 make bc bison flex libelf-dev libssl-dev kmod device-tree-compiler
      - name: Compile and verify kernel ABI
        run: bash scripts/build-module.sh 2>&1 | tee module-build.log
      - uses: actions/upload-artifact@v4
        with:
          name: photonicat-network-module
          path: dist/module/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: module-build-log
          path: module-build.log
          retention-days: 7
  image:
    needs: module
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: photonicat-network-module
          path: dist/module
      - name: Install image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y btrfs-progs dosfstools kmod device-tree-compiler u-boot-tools initramfs-tools-core util-linux
          sudo modprobe btrfs
          df -h
      - name: Download pinned base image
        run: python3 scripts/fetch-inputs.py image work/base.img.gz
      - name: Build and verify test image
        run: |
          set -o pipefail
          sudo python3 scripts/repack-image.py work/base.img.gz dist/module dist/firmware 2>&1 | tee image-build.log
          tar -czf dist/photonicat-module-source.tar.gz -C dist/module source build.json sources.lock.json
      - name: Publish test image
        if: github.event_name == 'push' || inputs.publish_test_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "test-${GITHUB_RUN_NUMBER}" \
            dist/firmware/*.img.gz dist/firmware/sha256sums dist/photonicat-module-source.tar.gz \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
            --title "光影猫飞牛适配 · 测试 ${GITHUB_RUN_NUMBER}" --notes-file docs/TEST-RELEASE.md
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: image-build-diagnostics
          path: |
            image-build.log
            dist/firmware/build.json
          retention-days: 7
